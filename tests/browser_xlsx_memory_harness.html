<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Browser XLSX memory harness</title>
</head>
<body>
  <pre id="result">running</pre>
  <script src="../frontend/memory-guard.js?v=20260814"></script>
  <script src="../frontend/file-readers.js?v=20260814"></script>
  <script src="../frontend/browser-snapshot-store.js?v=20260814"></script>
  <script>
    (async () => {
      const output = document.querySelector("#result");
      const filename = new URLSearchParams(location.search).get("file") || "/data/imports/oom-browser-test.xlsx";
      try {
        const response = await fetch(filename);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const blob = await response.blob();
        const sourceFile = new File([blob], filename.split("/").pop() || "test.xlsx");
        let fullFileReads = 0;
        Object.defineProperty(sourceFile, "arrayBuffer", {
          value: async () => {
            fullFileReads += 1;
            throw new Error("XLSX parser attempted to allocate the complete workbook");
          },
        });
        const started = performance.now();
        const heapBefore = performance.memory?.usedJSHeapSize || 0;
        let progressUpdates = 0;
        const preview = await window.MacAnalyzerFileReaders.clientXlsxTable(
          sourceFile,
          () => { progressUpdates += 1; },
          { maxRows: 100 },
        );
        const rounds = [];
        for (let round = 0; round < 3; round += 1) {
          let rows = 0;
          const table = await window.MacAnalyzerFileReaders.clientXlsxTable(
            sourceFile,
            () => { progressUpdates += 1; },
            { collectRows: false, onRow: () => { rows += 1; } },
          );
          rounds.push({ rows, reportedRows: table.rowCount, retainedRows: table.rows.length });
        }
        const diskRounds = [];
        const snapshotIds = [];
        for (let round = 0; round < 3; round += 1) {
          const jobId = `oom-job-${Date.now()}-${round}`;
          const snapshotId = `oom-idb-${Date.now()}-${round}`;
          snapshotIds.push(snapshotId);
          await window.MacAnalyzerBrowserSnapshots.clearEnrichment(jobId);
          for (let offset = 0; offset < 100000; offset += 750) {
            const batch = [];
            for (let index = offset; index < Math.min(100000, offset + 750); index += 1) {
              batch.push({
                mac: `A1B2C3${index.toString(16).padStart(6, "0").toUpperCase()}`,
                macFormatted: `A1:B2:C3:${(index >> 16 & 255).toString(16).padStart(2, "0")}:${(index >> 8 & 255).toString(16).padStart(2, "0")}:${(index & 255).toString(16).padStart(2, "0")}`.toUpperCase(),
                vendor: "Stress Vendor",
                model: `Model ${(index + round) % 20}`,
                valid: true,
              });
            }
            await window.MacAnalyzerBrowserSnapshots.mergeEnrichmentRows(jobId, batch);
            batch.length = 0;
          }
          const metadata = await window.MacAnalyzerBrowserSnapshots.saveEnrichmentSnapshot(
            jobId,
            { id: snapshotId, name: `OOM IndexedDB ${round + 1}` },
          );
          const page = await window.MacAnalyzerBrowserSnapshots.page(snapshotId, { offset: 99750, limit: 250 });
          const temporaryRows = await window.MacAnalyzerBrowserSnapshots.countEnrichmentRows(jobId);
          diskRounds.push({ round: round + 1, stored: metadata.deviceCount, pageRows: page.items.length, total: page.pagination.total, temporaryRows });
          await window.MacAnalyzerBrowserSnapshots.clearEnrichment(jobId);
        }
        const rollbackSourceId = `rollback-source-${Date.now()}`;
        const rollbackFailedId = `rollback-failed-${Date.now()}`;
        await window.MacAnalyzerBrowserSnapshots.save({
          id: rollbackSourceId,
          name: "Last successful Final",
          devices: [{ mac: "001122334455", valid: true }],
          invalid: [],
        });
        const rollbackJobId = `rollback-job-${Date.now()}`;
        await window.MacAnalyzerBrowserSnapshots.mergeEnrichmentRows(rollbackJobId, [{ mac: "001122334466", valid: true }]);
        let rollbackError = "";
        try {
          await window.MacAnalyzerBrowserSnapshots.saveEnrichmentSnapshot(
            rollbackJobId,
            { id: rollbackFailedId, name: "Must roll back" },
            [{ invalidClone: () => true }],
          );
        } catch (error) { rollbackError = error.name || error.message; }
        const rollbackSource = await window.MacAnalyzerBrowserSnapshots.load(rollbackSourceId);
        const rollbackFailed = await window.MacAnalyzerBrowserSnapshots.load(rollbackFailedId);
        const rollback = { error: rollbackError, previousDevices: rollbackSource?.devices?.length || 0, failedSnapshotExists: Boolean(rollbackFailed) };
        await window.MacAnalyzerBrowserSnapshots.removeSnapshot(rollbackSourceId);
        for (const snapshotId of snapshotIds) await window.MacAnalyzerBrowserSnapshots.removeSnapshot(snapshotId);
        const heapAfter = performance.memory?.usedJSHeapSize || 0;
        output.dataset.status = "complete";
        output.textContent = JSON.stringify({
          previewRows: preview.rows.length,
          reportedRows: preview.rowCount,
          headers: preview.headers,
          sheet: preview.sheet,
          rounds,
          diskRounds,
          rollback,
          heapDelta: heapBefore && heapAfter ? heapAfter - heapBefore : null,
          progressUpdates,
          fullFileReads,
          elapsedMs: Math.round(performance.now() - started),
        });
      } catch (error) {
        output.dataset.status = "error";
        output.textContent = JSON.stringify({ error: error.message, code: error.code || "" });
      }
    })();
  </script>
</body>
</html>
