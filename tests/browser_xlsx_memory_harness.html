<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Browser XLSX memory harness</title>
</head>
<body>
  <pre id="result">running</pre>
  <script src="../frontend/memory-guard.js"></script>
  <script src="../frontend/file-readers.js"></script>
  <script src="../frontend/browser-snapshot-store.js"></script>
  <script>
    (async () => {
      const output = document.querySelector("#result");
      const filename = new URLSearchParams(location.search).get("file") || "/data/imports/oom-browser-test.xlsx";
      try {
        const response = await fetch(filename);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const blob = await response.blob();
        const sourceFile = new File([blob], filename.split("/").pop() || "test.xlsx");
        const started = performance.now();
        const heapBefore = performance.memory?.usedJSHeapSize || 0;
        let progressUpdates = 0;
        const preview = await window.MacAnalyzerFileReaders.clientXlsxTable(
          sourceFile,
          () => { progressUpdates += 1; },
          { maxRows: 100 },
        );
        const rounds = [];
        for (let round = 0; round < 3; round += 1) {
          let rows = 0;
          const table = await window.MacAnalyzerFileReaders.clientXlsxTable(
            sourceFile,
            () => { progressUpdates += 1; },
            { collectRows: false, onRow: () => { rows += 1; } },
          );
          rounds.push({ rows, reportedRows: table.rowCount, retainedRows: table.rows.length });
        }
        const snapshotId = `oom-idb-${Date.now()}`;
        const devices = Array.from({ length: 100000 }, (_, index) => ({
          mac: `A1B2C3${index.toString(16).padStart(6, "0").toUpperCase()}`,
          macFormatted: `A1:B2:C3:${(index >> 16 & 255).toString(16).padStart(2, "0")}:${(index >> 8 & 255).toString(16).padStart(2, "0")}:${(index & 255).toString(16).padStart(2, "0")}`.toUpperCase(),
          vendor: "Stress Vendor",
          model: `Model ${index % 20}`,
          valid: true,
        }));
        await window.MacAnalyzerBrowserSnapshots.save({ id: snapshotId, name: "OOM IndexedDB", devices, invalid: [] });
        devices.length = 0;
        const storedPages = [];
        for (const offset of [0, 49750, 99750]) {
          const page = await window.MacAnalyzerBrowserSnapshots.page(snapshotId, { offset, limit: 250 });
          storedPages.push({ offset, rows: page.items.length, total: page.pagination.total });
        }
        await window.MacAnalyzerBrowserSnapshots.removeSnapshot(snapshotId);
        const heapAfter = performance.memory?.usedJSHeapSize || 0;
        output.dataset.status = "complete";
        output.textContent = JSON.stringify({
          previewRows: preview.rows.length,
          reportedRows: preview.rowCount,
          headers: preview.headers,
          sheet: preview.sheet,
          rounds,
          storedPages,
          heapDelta: heapBefore && heapAfter ? heapAfter - heapBefore : null,
          progressUpdates,
          elapsedMs: Math.round(performance.now() - started),
        });
      } catch (error) {
        output.dataset.status = "error";
        output.textContent = JSON.stringify({ error: error.message, code: error.code || "" });
      }
    })();
  </script>
</body>
</html>
